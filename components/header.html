<!-- Header Component -->

    <div class="container header-container">
        <h1>Pet Connect</h1>
        <nav>
            <ul>
                <li><a href="index.html" id="nav-home">Home</a></li>
                <li><a href="browse.html" id="nav-browse">Browse Pets</a></li>
                <li><a href="sell.html" id="nav-sell">Sell a Pet</a></li>

        <div class="auth-buttons">
            <a href="#" class="auth-btn login-btn" id="loginBtn">Login</a>
            <a href="#" class="auth-btn signup-btn" id="signupBtn">Sign Up</a>
        </div>
    </div>
</header>

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeLogin">&times;</span>
        <h2 class="form-title">Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
            <div class="form-footer">
                <p>Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
            </div>
        </form>
    </div>
</div>

<!-- Signup Modal -->
<div id="signupModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeSignup">&times;</span>
        <h2 class="form-title">Create Account</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" required>
            </div>
            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" required>
            </div>
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" required>
            </div>
            <div class="form-group">
                <label for="signupConfirm">Confirm Password</label>
                <input type="password" id="signupConfirm" required>
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
            <div class="form-footer">
                <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
            </div>
        </form>
    </div>
</div>

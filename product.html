<div class="form-container">
  <h2>Post Your Pet Ad</h2>
  <form>
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category">
        <option value="">Select</option>
        <option value="bird">Bird</option>
        <option value="hen">Hen</option>
        <option value="duck">Duck</option>
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
      </select>
    </div>

    <div class="form-group">
      <label for="title">Ad Title</label>
      <input type="text" id="title" placeholder="Enter Ad Title">
    </div>

    <div class="form-group">
      <label for="breed">Breed Name</label>
      <input type="text" id="breed" placeholder="Enter Breed Name">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" placeholder="Enter Description"></textarea>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="age-years">Age in Years</label>
        <select id="age-years">
          <option value="">Select</option>
          <option>0</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
      <div class="form-group">
        <label for="age-months">Age in Months</label>
        <select id="age-months">
          <option value="">Select</option>
          <option>0</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
          <option>9</option>
          <option>10</option>
          <option>11</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="price">Price (PKR)</label>
        <input type="number" id="price" placeholder="Enter Price">
      </div>
      <div class="form-group">
        <label for="price-type">Price Type</label>
        <select id="price-type">
          <option value="">Select</option>
          <option value="fixed">Fixed</option>
          <option value="negotiable">Negotiable</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Search for a location">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="province">Province</label>
        <select id="province">
          <option value="">Select</option>
          <option value="punjab">Punjab</option>
          <option value="sindh">Sindh</option>
          <option value="kpk">Khyber Pakhtunkhwa</option>
          <option value="balochistan">Balochistan</option>
          <option value="islamabad">Islamabad</option>
        </select>
      </div>
      <div class="form-group">
        <label for="district">District</label>
        <input type="text" id="district" placeholder="Enter District">
      </div>
    </div>

    <div class="form-group">
      <label for="image">Browse Image of Your Pet</label>
      <input type="file" id="image" accept="image/*">
    </div>

    <button type="submit" class="submit-btn">Post Ad</button>
    <br><br>
     <button class="submit-btn" ><a href="index.html" >   go back Home page   </a></button>
  </form>
</div>
